name = "il-flood-dashboard"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "il-flood-dashboard-db"
database_id = "3b53da49-c3c8-4c09-9cfd-67d1def2464a"

[[kv_namespaces]]
binding = "IL_FLOOD_KV"
id = "825beb9578a94bef8aba50749620217e"

[vars]
# Secrets are set via Cloudflare Pages dashboard or wrangler CLI, not stored here.
# MAPBOX_TOKEN, ADMIN_SECRET, ALERTS_ENABLED, RESEND_API_KEY are all Pages secrets.
# NEXT_PUBLIC_MAPBOX_TOKEN must also be set as a Pages secret (set it via wrangler pages secret put)
